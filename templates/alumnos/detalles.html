{% extends "layout.html" %} 
{% block container %}
<div class="py-20 flex justify-center px-4">
  <div class="bg-white dark:bg-gray-800 max-w-lg w-full p-10 rounded-3xl shadow-2xl border border-gray-100 dark:border-gray-700 relative">
    <div class="flex flex-col items-center">
      <div class="w-32 h-32 bg-purple-100 rounded-full flex items-center justify-center mb-6 text-5xl">🎓</div>
      
      <h2 class="text-3xl font-extrabold text-gray-900 dark:text-white mb-2 text-center">
        {{ nombre }} {{ apaterno }} {{ amaterno }}
      </h2>
      <p class="text-purple-600 font-bold mb-8">Estudiante de Ingeniería</p>

      <div class="w-full space-y-4 bg-gray-50 dark:bg-gray-900 p-6 rounded-2xl mb-8">
        <p class="text-gray-600 dark:text-gray-400"><span class="font-bold text-gray-900 dark:text-white">ID de Sistema:</span> #{{ id }}</p>
        <p class="text-gray-600 dark:text-gray-400"><span class="font-bold text-gray-900 dark:text-white">Edad:</span> {{ edad }} años</p>
        <p class="text-gray-600 dark:text-gray-400"><span class="font-bold text-gray-900 dark:text-white">Correo Institucional:</span> {{ correo }}</p>
      </div>
      
      <a href="{{ url_for('alumnos.alumnos') }}" class="w-full text-center bg-gray-800 text-white font-bold py-4 rounded-2xl hover:bg-gray-900 transition-all shadow-lg">
        Regresar a la Lista
      </a>
    </div>
  </div>
</div>
{% endblock %}
